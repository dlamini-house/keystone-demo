[1,'The Courtyard House','Featherbrooke Estate',4250000,4,3,380,['Solar','Security Estate'],'photo-1613490493576-7fde63acd811',36,25],
[2,'A modern family retreat','Noordheuwel',2895000,3,2,265,['Solar','Borehole'],'photo-1600596542815-ffad4c1539a9',69,39],

[6,'Oak Lane Cottage','Kenmare',1495000,2,1,120,[],'photo-1600047509782-20d39509f26d',61,81]
].map(([id,title,suburb,price,beds,baths,area,features,image,x,y])=>({id,title,suburb,price,beds,baths,area,features,image,x,y,sample:true}));
const zar=n=>'R '+new Intl.NumberFormat('en-ZA',{maximumFractionDigits:0}).format(n);

let listings=[],leads=[],kyc=[];
let view='grid', query='', selected, step=0, draft={}, accountMode='in', modal='', busy=false;

const field=(label,name,opts='')=>'<label class="field">'+label+'<input name="'+name+'" '+opts+'></label>';
const check=(label,name='consent')=>'<label class="check"><input type="checkbox" name="'+name+'" required>'+label+'</label>';

root.innerHTML='<header class="top"><div class="wrap nav"><a class="brand" href="#"><span class="mark" aria-hidden="true">◆</span><span>Keystone<small>Property Portal</small></span></a><nav aria-label="Main navigation">'+btn('Browse properties','browse','quiet')+'</nav>'+btn(authButton(),'account','primary')+'</div></header>'+
'<section class="hero"><div class="wrap"><div class="eyebrow">West Rand · Gauteng</div><h1>Find your place<br>in <span>Krugersdorp.</span></h1><p>Explore homes with features that matter in South Africa.</p><form class="search" id="search"><label for="q" class="sr">Search by suburb or property title</label><input id="q" placeholder="Search suburb or property"><button class="accent">Search →</button></form></div></section>'+
'<div class="ribbon"><div class="wrap"><span>◇ Krugersdorp &amp; surrounds</span><span>✓ Sample buyer enquiries</span><span>R All prices in South African rand</span></div></div>'+
'<section id="results" class="wrap results"><div class="sectionhead"><div><h2>Explore properties</h2><p>'+(live?'Browse approved listings':'Client demo · Fictional listings')+'</p></div><div class="seg">'+btn('▦ Grid','grid')+btn('⌖ Map','map')+'</div></div><div class="browse"><form id="filter" class="panel filter"><div class="row"><h3>Filters</h3>'+btn('Reset','reset','quiet')+'</div><label class="field">Suburb<select name="suburb"><option value="">All suburbs</option></select></label>'+field('Min price (R)','min','type="number" min="0" placeholder="No minimum"')+field('Max price (R)','max','type="number" min="0" placeholder="No maximum"')+'<fieldset><legend>Property features</legend>'+features.map(f=>'<label class="check"><input name="feature" type="checkbox" value="'+f+'">'+f+'</label>').join('')+'</fieldset></form><div><div class="tools"><span id="count" aria-live="polite"></span><label>Sort <select id="sort"><option value="default">Featured</option><option value="low">Price low to high</option><option value="high">Price high to low</option></select></label></div><div id="feed"></div></div></div></section>'+
'<footer><div class="wrap row"><div><strong>Keystone Property Portal</strong><div>Krugersdorp, South Africa</div></div>'+'<span>Interactive concept by Dlamini House</span>'+'</div></footer><dialog id="dialog" aria-labelledby="dialog-title"></dialog><output aria-live="polite" id="notice" class="notice" hidden></output>';
const $=s=>root.querySelector(s);
const dialog=$('#dialog');
let timer;
function notify(message){const n=$('#notice');n.textContent=message;n.hidden=false;clearTimeout(timer);timer=setTimeout(()=>n.hidden=true,5500)}
async function api(path,{method='GET',body,token=session?.access_token,prefer}={}){
 const headers={apikey:key,'Content-Type':'application/json'};
 if(token)headers.Authorization='Bearer '+token;
 if(prefer)headers.Prefer=prefer;
 const res=await fetch(url.replace(/\/$/,'')+path,{method,headers,body:body===undefined?undefined:JSON.stringify(body)});
 const data=await res.json().catch(()=>null);
 if(!res.ok)throw new Error(data?.message??data?.msg??data?.error_description??'The request could not be completed.');
 return data;
}
async function refresh(){
 if(live){
  listings=await api('/rest/v1/listings?select=*&order=created_at.desc');
  [leads,kyc]=session?await Promise.all([api('/rest/v1/leads?select=*&order=created_at.desc'),api('/rest/v1/professional_applications?select=*&order=created_at.desc')]):[[],[]];
 }else{
  listings=[...samples.map(p=>p.id===1?{...p,user_id:"seller@example.test",status:"approved"}:p),...read('listings',[])];leads=read('leads',[]);kyc=read('kyc',[]);
 }
 root.querySelector('.nav > button').textContent=authButton();
 const suburb=$('#filter select'), old=suburb.value;
 suburb.innerHTML='<option value="">All suburbs</option>'+[...new Set(publicListings().map(p=>p.suburb))].sort().map(s=>'<option>'+esc(s)+'</option>').join('');
 suburb.value=[...suburb.options].some(o=>o.value===old)?old:'';
 render();
}
const publicListings=()=>listings.filter(p=>p.sample||p.status==='approved');
function render(){
 const filters=new FormData($('#filter'));
 const required=filters.getAll('feature');
 const set=publicListings().filter(p=>(!filters.get('suburb')||p.suburb===filters.get('suburb'))&&p.price>=Number(filters.get('min')||0)&&p.price<=Number(filters.get('max')||Infinity)&&required.every(f=>p.features.includes(f))&&(!query||[p.title,p.suburb,'Krugersdorp'].join(' ').toLowerCase().includes(query)));
 const order=$('#sort').value;
 if(order!=='default')set.sort((a,b)=>(a.price-b.price)*(order==='low'?1:-1));
 $('#count').textContent=set.length+' '+(set.length===1?'property':'properties');
 for(const id of ['grid','map'])root.querySelector('[data-action="'+id+'"]').setAttribute('aria-pressed',String(view===id));
 const markers=set.filter(p=>p.x!=null&&p.y!=null);
 $('#feed').innerHTML=!set.length?'<p class="empty">No properties match these filters. Try a different suburb or price range.</p>':view==='grid'?'<div class="cards">'+set.map(card).join('')+'</div>':
 '<div class="map" aria-label="Illustrative area map"><svg viewBox="0 0 800 460" preserveAspectRatio="none" aria-hidden="true"><path fill="#d6e4cd" d="M0 0H360L312 143 0 262ZM800 460H545L660 278 800 216Z"/><path fill="none" stroke="#b8cbbc" stroke-width="12" d="M0 184Q172 270 320 112T800 68"/><path fill="none" stroke="#fff" stroke-width="9" d="M-10 394L106 320 344 335 448 219 810 254M134 0L260 133 344 335 377 460M0 108L260 133 448 219 674 147 799 161M576 0L674 147 732 370 795 455"/></svg>'+markers.map(p=>'<button class="pin" style="left:'+Number(p.x)+'%;top:'+Number(p.y)+'%" data-action="detail:'+esc(p.id)+'" aria-label="'+esc(p.title)+' '+zar(p.price)+'">'+zar(p.price)+'</button>').join('')+'<legend>Krugersdorp · Approximate demo positions</legend></div>'+(set.length>markers.length?'<p class="muted">Listings without a map position</p><div class="cards">'+set.filter(p=>!markers.includes(p)).map(card).join('')+'</div>':'');
}
function card(p){
 return '<article class="card"><div class="picture">'+(image(p)?'<img loading="lazy" src="'+esc(image(p))+'" alt="">':'')+'<span class="tag">'+(p.sample?'Sample listing':'✓ Listing reviewed')+'</span></div><div class="body"><strong>'+zar(p.price)+'</strong><h3>'+esc(p.title)+'</h3><p>'+esc(p.suburb)+', Krugersdorp</p><p>'+p.beds+' beds · '+p.baths+' baths · '+p.area+' m²</p><div class="chips">'+p.features.map(f=>'<span class="chip">'+esc(f)+'</span>').join('')+'</div>'+btn('View property →','detail:'+p.id)+'</div></article>';
}
function open(name,title,html){
 modal=name;dialog.innerHTML='<div class="row"><h2 id="dialog-title">'+title+'</h2>'+btn('Close','close','quiet')+'</div>'+html;
 if(!dialog.open)dialog.showModal();
 else dialog.querySelector('h2').setAttribute('tabindex','-1'),dialog.querySelector('h2').focus();
}
const form=(content,label)=>'<form>'+content+'<div class="formactions"><button class="primary">'+label+'</button></div></form>';
function account(){
 if(session){workspace();return}
 open('account',live?(accountMode==='in'?'Sign in':'Create an account'):'Enter the demo workspace',
 form((live?'':'<p class="muted">Use a fictional email. Demo records stay in this browser.</p>')+field('Email','email','type="email" required autocomplete="email"')+(live?field('Password','password','type="password" required minlength="8" autocomplete="'+(accountMode==='in'?'current-password':'new-password')+'"'):''),
 live?(accountMode==='in'?'Sign in':'Create account'):'Continue')+(live?btn(accountMode==='in'?'Create an account':'Back to sign in','account-mode','quiet'):''));
}
function gate(action){
 if(session)return true;
 account();notify('Sign in to '+action+'.');return false;
}
function detail(p){
 if(!p)return;
 selected=p;
 open('detail',esc(p.title),(image(p)?'<img src="'+esc(image(p))+'" alt="">':'')+'<div class="panel"><strong>'+zar(p.price)+'</strong><p>'+esc(p.suburb)+', Krugersdorp · '+p.beds+' beds · '+p.baths+' baths · '+p.area+' m²</p><p class="step">'+esc(p.features.join(' · '))+'</p><p>'+esc(p.description??'Illustrative property for the Keystone preview.')+'</p></div>'+btn('Enquire about this property','enquire','primary'));
}
function enquiry(){
 if(!gate('submit an enquiry'))return;
 open('enquiry','Property enquiry','<p class="muted">'+esc(selected.title)+'</p>'+form(field('Name','name','required maxlength="100"')+'<label class="field">Message<textarea name="message" required maxlength="1500" rows="4">I would like to arrange a viewing.</textarea></label>'+check('I agree that my enquiry and account email may be shared with the listing owner so they can respond.'),'Send enquiry'));
}
function seller(){
 if(!gate('submit a listing'))return;
 const value=(name)=>' value="'+esc(draft[name])+'"';
 const steps=['Property details','Features & photo','Review & submit'];
 const content=[
 field('Listing title','title','required maxlength="120"'+value('title'))+field('Suburb','suburb','required maxlength="80"'+value('suburb'))+field('Asking price (R)','price','type="number" min="1" required'+value('price'))+field('Bedrooms','beds','type="number" min="0" max="99" required'+value('beds'))+field('Bathrooms','baths','type="number" min="0" max="99" required'+value('baths'))+field('Floor area (m²)','area','type="number" min="1" required'+value('area')),
 '<fieldset><legend>Features</legend>'+features.map(f=>'<label class="check"><input name="features" type="checkbox" value="'+f+'" '+(draft.features?.includes(f)?'checked':'')+'>'+f+'</label>').join('')+'</fieldset>'+field('Photo URL (optional)','image','type="url" pattern="https://.+"'+value('image'))+'<label class="field">Description<textarea name="description" required maxlength="2000" rows="4">'+esc(draft.description)+'</textarea></label>',
 '<div class="panel"><strong>'+esc(draft.title)+'</strong><p>'+esc(draft.suburb)+' · '+zar(draft.price??0)+'</p><p>'+esc(draft.features?.join(' · '))+'</p><p>'+esc(draft.description)+'</p></div>'+check('I am authorised to list this property and agree that Keystone may process the information for listing review and publication.')];
 open('sell','List a property','<p class="step">Step '+(step+1)+' of 3 · '+steps[step]+'</p><form>'+content[step]+'<div class="formactions">'+(step?btn('Back','back'):'')+'<button class="primary">'+(step===2?'Submit for review':'Continue')+'</button></div></form>');
}
function professionals(){
 if(!gate('register as a professional'))return;
 open('kyc','Professional registration','<p class="muted">Submit company and registration details for review. Use fictional details in the preview.</p>'+form(field('Full name','name','required maxlength="100"')+field('Organisation','organisation','required maxlength="150"')+'<label class="field">Professional role<select name="role"><option>Estate agent</option><option>Agency principal</option><option>Conveyancer</option><option>Bond originator</option></select></label>'+field('Professional registration number','registration','required maxlength="100"')+check('I agree to the processing of these details for professional verification.'),'Submit registration'));
}
function workspace(){
 const owner=session.user.id;
 const myList=listings.filter(p=>p.user_id===owner);
 const myLeads=leads.filter(p=>p.user_id===owner);
 const incoming=leads.filter(p=>myList.some(l=>String(l.id)===String(p.listing_id)));
 const myKyc=kyc.filter(p=>p.user_id===owner);
 const heading=(title,items,renderItem)=>'<h3>'+title+'</h3>'+(items.length?items.map(renderItem).join(''):'<p class="muted">No records yet.</p>');
 open('workspace','My workspace','<div class="dashboard"><p class="muted">'+esc(session.user.email)+'</p>'+
 '<div class="panel">'+heading('My listings',myList,p=>'<article>'+esc(p.title)+' · <strong>'+esc(p.status)+'</strong></article>')+'</div>'+
 '<div class="panel">'+heading('My enquiries',myLeads,p=>'<article>'+esc(p.listing_title)+' · <strong>'+esc(p.status)+'</strong><br>'+esc(p.message)+'</article>')+'</div>'+
 '<div class="panel">'+heading('Incoming leads',incoming,p=>'<article><strong>'+esc(p.listing_title)+'</strong> · '+esc(p.name)+' · '+esc(p.email)+'<p>'+esc(p.message)+'</p><label class="field">Lead status<select data-lead="'+esc(p.id)+'">'+statuses.map(s=>'<option '+(s===p.status?'selected':'')+'>'+s+'</option>').join('')+'</select></label></article>')+'</div>'+
 '<div class="panel">'+heading('Professional verification',myKyc,p=>'<article>'+esc(p.organisation)+' · <strong>'+esc(p.status)+'</strong></article>')+'</div></div>'+btn('Sign out','logout'));
}
async function save(table,record){
 if(live)await api('/rest/v1/'+table,{method:'POST',body:record});
 else{
  const name=table==='professional_applications'?'kyc':table;
  write(name,[{...record,id:crypto.randomUUID()},...read(name,[])]);
 }
}
dialog.addEventListener('submit',async e=>{
 e.preventDefault();if(busy)return;
 const fd=new FormData(e.target), values=Object.fromEntries(fd), task=modal;
 busy=true;const submit=e.submitter;if(submit)submit.disabled=true;
 try{
  if(task==='account'){
   if(live){
    const result=await api(accountMode==='in'?'/auth/v1/token?grant_type=password':'/auth/v1/signup',{method:'POST',body:values,token:null});
    if(!result.access_token){notify('Check your email to confirm your account, then sign in.');return}
    session=result;
   }else{session={user:{id:values.email.trim().toLowerCase(),email:values.email.trim().toLowerCase()}};write('session',session)}
   await refresh();
   if(selected&&dialog.dataset.resume==='enquiry'){delete dialog.dataset.resume;enquiry()}
   else workspace();
   return;
  }
  if(!session)throw new Error('Please sign in again.');
  const consent={consent_version:version,user_id:session.user.id};
  if(task==='sell'){
   if(step<2){
    Object.assign(draft,values);
    if(step===1)draft.features=fd.getAll('features');
    step++;seller();return;
   }
   await save('listings',{...consent,...draft,price:Number(draft.price),beds:Number(draft.beds),baths:Number(draft.baths),area:Number(draft.area),status:'pending'});
   draft={};step=0;notify('Listing submitted for review.');
  }else if(task==='enquiry'){
   await save('leads',{...consent,listing_id:selected.id,listing_title:selected.title,name:values.name,message:values.message,email:session.user.email,status:'New'});
   notify('Enquiry received. Track the response in My workspace.');
  }else if(task==='kyc'){
   delete values.consent;
   await save('professional_applications',{...values,...consent,status:'pending'});
   notify('Professional registration submitted for review.');
  }
  await refresh();workspace();
 }catch(err){notify(err.message)}finally{busy=false;if(submit)submit.disabled=false}
});
root.addEventListener('click',async e=>{
 const hit=e.target.closest('[data-action]');if(!hit)return;
 const [action,id]=hit.dataset.action.split(':');
 if(action==='close'){dialog.close();delete dialog.dataset.resume}
 if(action==='account')location.href='./admin.html';
 if(action==='account-mode'){accountMode=accountMode==='in'?'up':'in';account()}
 if(action==='grid'||action==='map'){view=action;render()}
 if(action==='browse')$('#results').scrollIntoView({behavior:'smooth'});
 if(action==='reset'){$('#filter').reset();$('#q').value='';query='';render()}
 if(action==='sell')seller();
 if(action==='back'){const fd=new FormData(dialog.querySelector('form'));if(step===1){Object.assign(draft,Object.fromEntries(fd));draft.features=fd.getAll('features')}step--;seller()}
 if(action==='kyc')professionals();
 if(action==='detail')detail(listings.find(p=>String(p.id)===id));
 if(action==='enquire')pitchEnquiry();
 if(action==='privacy')open('privacy','Privacy & consent','<p>Keystone records the purpose, date and policy version when you submit an enquiry, a listing or a professional registration. Enquiry details are shared with the listing owner for follow-up.</p><p class="step">'+(live?'Policy version '+version:'Demo only. Use fictional details. Records are stored in this browser.')+'</p>'+(!live?btn('Clear demo data','clear'):''));
 if(action==='clear')open('clear','Clear demo data?','<p>This removes all Keystone demo records from this browser.</p><div class="formactions">'+btn('Keep records','close')+btn('Clear records','confirm-clear','primary')+'</div>');
 if(action==='confirm-clear'){for(const k of ['listings','leads','kyc','session'])localStorage.removeItem('keystone:'+k);session=null;draft={};step=0;dialog.close();await refresh();notify('Demo records cleared.')}
 if(action==='logout'){try{if(live)await api('/auth/v1/logout',{method:'POST'});else write('session',null);session=null;dialog.close();await refresh()}catch(err){notify(err.message)}}
});
dialog.addEventListener('change',async e=>{
 const {lead}=e.target.dataset;if(!lead)return;
 const p=leads.find(l=>String(l.id)===lead);
 try{
  if(live)await api('/rest/v1/leads?id=eq.'+encodeURIComponent(lead),{method:'PATCH',body:{status:e.target.value},prefer:'return=representation'});
  else write('leads',leads.map(l=>l===p?{...l,status:e.target.value}:l));
  await refresh();notify('Lead status updated.');
 }catch(err){e.target.value=p.status;notify(err.message)}
});
$('#filter').addEventListener('input',render);
$('#filter').addEventListener('submit',e=>e.preventDefault());
$('#sort').addEventListener('change',render);
$('#search').addEventListener('submit',e=>{e.preventDefault();query=$('#q').value.trim().toLowerCase();render();$('#results').scrollIntoView({behavior:'smooth'})});

const pitchKey='keystone-client-demo-v1';
const seed=[{id:'sample',title:'The Courtyard House',suburb:'Featherbrooke Estate',status:'New',message:'Is a Saturday viewing available?'}];
const readPitch=()=>{try{return JSON.parse(localStorage.getItem(pitchKey))??seed}catch{return seed}};
function writePitch(rows){try{localStorage.setItem(pitchKey,JSON.stringify(rows));return true}catch{return false}}
function pitchEnquiry(){
 open('pitch','Try a buyer enquiry','<div class="panel"><h3>'+esc(selected.title)+'</h3><p>Sample buyer · I’d like to arrange a weekend viewing.</p></div>'+btn('Send sample enquiry','pitch-send','primary'));
}
root.addEventListener('click',e=>{
 if(e.target.closest('[data-action="pitch-send"]')){
 const lead={id:String(Date.now()),title:selected.title,suburb:selected.suburb,status:'New',message:'I’d like to arrange a weekend viewing.'};
 writePitch([lead,...readPitch()]);
 open('pitch-done','Sample enquiry sent','<p>Open the admin demo to see the enquiry and update its status.</p><p class="step"><a href="./admin.html?sample='+selected.id+'&id='+lead.id+'">Open admin demo →</a></p>');
 }
});
function startPitch(){
 if(!document.body.hasAttribute('data-admin')){refresh().catch(err=>notify(err.message));return}
 const params=new URLSearchParams(location.search), id=params.get('id'), p=samples.find(p=>p.id===Number(params.get('sample')));
 let rows=readPitch();
 if(p&&id&&!rows.some(l=>l.id===id)){
 rows=[{id,title:p.title,suburb:p.suburb,status:'New',message:'I’d like to arrange a weekend viewing.'},...rows];
 writePitch(rows);
 }
 root.innerHTML='<header class="top"><div class="nav wrap"><a class="brand" href="./index.html"><span class="mark" aria-hidden="true">◆</span><span>Keystone<small>Property Portal</small></span></a><a class="cta primary" href="./index.html">← Property demo</a></div></header><section class="admin-hero"><div class="wrap"><p class="eyebrow">Keystone · Admin demo</p><h1>Enquiry dashboard</h1><p>Track buyer enquiries and manage follow-up.</p></div></section><section class="wrap results"><div id="metrics" class="metrics"></div><div class="sectionhead"><div><h2>Buyer enquiries</h2><p>Fictional activity from the property demo</p></div></div><label class="field lead-filter">Status<select id="lead-filter"><option>All statuses</option>'+statuses.map(s=>'<option>'+s+'</option>').join('')+'</select></label><p id="announcement" class="sr" aria-live="polite"></p><div id="queue"></div></section><footer><div class="wrap row"><strong>Keystone Property Portal</strong><span>Interactive concept by Dlamini House</span></div></footer>';
 function draw(){
 const filter=$('#lead-filter').value;
 $('#metrics').innerHTML=[['Total enquiries',rows.length],['New',rows.filter(r=>r.status==='New').length],['Viewing scheduled',rows.filter(r=>r.status==='Viewing scheduled').length]].map(([title,total])=>'<div class="panel"><p class="muted">'+title+'</p><strong>'+total+'</strong></div>').join('');
 const filtered=rows.filter(r=>filter==='All statuses'||r.status===filter);
 $('#queue').innerHTML=filtered.length?filtered.map(r=>'<article class="panel lead"><div><span class="chip">'+esc(r.status)+'</span><h3>'+esc(r.title)+'</h3><p class="muted">'+esc(r.suburb)+' · Sample buyer</p><p>'+esc(r.message)+'</p></div><label class="field">Enquiry status<select data-id="'+esc(r.id)+'">'+statuses.map(s=>'<option '+(s===r.status?'selected':'')+'>'+s+'</option>').join('')+'</select></label></article>').join(''):'<p class="empty">No enquiries match this status.</p>';
 }
 $('#lead-filter').addEventListener('change',draw);
 $('#queue').addEventListener('change',e=>{
 if(!e.target.dataset.id)return;
 rows=rows.map(r=>r.id===e.target.dataset.id?{...r,status:e.target.value}:r);
 writePitch(rows);$('#announcement').textContent='Enquiry updated to '+e.target.value;draw();
 });
 draw();
}

startPitch();
</script></body></html>
